<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <link rel="icon" href="data:,">
  <title>SayHelp · 在线咨询</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b2741;
      --muted: #748098;
      --line: #e7ebf2;
      --blue: #5268d9;
      --blue-deep: #4056c1;
      --bg: #f5f7fb;
      --paper: #ffffff;
      --sidebar: #eef1f9;
      --shadow: 0 24px 70px rgba(43, 62, 107, .10);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(circle at 2% 0%, #e8eeff 0, transparent 34%),
                  radial-gradient(circle at 97% 95%, #f2eafa 0, transparent 30%),
                  var(--bg);
      color: var(--ink);
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell {
      width: min(1320px, calc(100% - 48px));
      height: min(900px, calc(100dvh - 48px));
      min-height: 0;
      grid-template-rows: minmax(0, 1fr);
      margin: 24px auto;
      display: grid;
      grid-template-columns: 285px minmax(0, 1fr);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(216, 224, 239, .9);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 34px;
      padding: 28px 23px 24px;
      background: linear-gradient(160deg, #f0f3fc, #e9eef8 68%, #eef2fa);
      border-right: 1px solid #e5eaf4;
    }
    .sidebar { min-height: 0; overflow: hidden; }
    .sidebar > * { flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark, .agent-avatar, .welcome-icon {
      display: grid; place-items: center; flex: none;
      background: linear-gradient(135deg, #7184eb, #4c63d2);
      color: white;
      box-shadow: 0 8px 20px rgba(82, 104, 217, .22);
    }
    .brand-mark { width: 38px; height: 38px; border-radius: 12px; font-size: 20px; font-weight: 700; }
    .brand-name { font-size: 16px; font-weight: 750; letter-spacing: .03em; }
    .brand-sub { margin-top: 3px; font-size: 11px; color: #8792a8; letter-spacing: .12em; text-transform: uppercase; }
    .side-title { font-size: 11px; font-weight: 700; color: #9aa5b8; letter-spacing: .14em; margin: 0 8px 12px; }
    .new-chat {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 13px 15px; border: 0; border-radius: 12px;
      background: #fff; color: #304061; text-align: left; font-weight: 650;
      box-shadow: 0 4px 16px rgba(65, 84, 137, .07);
      transition: transform .18s, box-shadow .18s;
    }
    .new-chat:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(65, 84, 137, .12); }
    .new-chat:disabled { opacity: .55; cursor: default; transform: none; }
    .new-chat .plus { font-size: 22px; line-height: 16px; color: var(--blue); font-weight: 400; }
    .side-card {
      margin-top: auto; padding: 18px 17px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 16px;
    }
    .side-card .spark { font-size: 19px; }
    .side-card strong { display: block; margin-top: 12px; font-size: 13px; }
    .side-card p { margin: 8px 0 0; color: #8390a7; font-size: 12px; line-height: 1.7; }
    .side-foot { color: #9da8b9; font-size: 11px; padding-left: 4px; line-height: 1.6; }
    .history-section { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; margin-top: -15px; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: #a8b5d5 transparent; overscroll-behavior: contain; }
    .history-section::-webkit-scrollbar { width: 7px; }
    .history-section::-webkit-scrollbar-thumb { background: #a8b5d5; border-radius: 8px; }
    .history-row { display: flex; align-items: center; min-width: 0; border-radius: 10px; }
    .history-row:hover, .history-row:has([aria-current="true"]) { background: white; }
    .history-row .history-item { flex: 1; min-width: 0; }
    .history-dots { flex: none; width: 32px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #748098; font-size: 19px; letter-spacing: 1px; }
    .history-dots:hover, .history-dots[aria-expanded="true"] { color: var(--blue-deep); background: #e8edff; }
    .history-dots:disabled { opacity: .4; cursor: default; }
    .history-pin { font-size: 10px; color: var(--blue); margin-right: 5px; }
    .history-menu { position: fixed; z-index: 20; width: 142px; padding: 5px; background: white; border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 9px 28px rgba(27,39,65,.16); }
    .history-menu[hidden] { display: none; }
    .history-menu button { display: block; width: 100%; border: 0; border-radius: 7px; background: transparent; padding: 10px 13px; text-align: left; color: var(--ink); font-size: 12px; }
    .history-menu button:hover, .history-menu button:focus-visible { background: #eef2ff; }
    .history-menu .history-delete { color: #bd4356; }
    .history-notice { color: var(--blue-deep); font-size: 12px; line-height: 1.6; padding: 0 8px; margin: 0 0 8px; }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .history-list { display: grid; gap: 7px; }
    .history-item { border: 0; border-radius: 10px; padding: 10px 12px; background: transparent; text-align: left; color: #53627c; width: 100%; }
    .history-item:hover, .history-item[aria-current="true"] { background: white; color: var(--blue-deep); }
    .history-item:disabled { cursor: default; opacity: .6; }
    .history-title { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
    .history-date { display: block; margin-top: 4px; color: #95a0b3; font-size: 10px; }
    .history-empty { color: var(--muted); font-size: 12px; padding: 10px; }
    .history-more { margin-top: 8px; border: 0; background: transparent; color: var(--blue); font-size: 12px; padding: 8px; }
    .top-actions { display: flex; gap: 8px; }
    .history-toggle { display: none; }
    .history-backdrop { display: none; }
    .citation { display: inline; border: 0; border-radius: 4px; background: #e1e7fc; color: #4056c1; font-size: inherit; padding: 0 3px; }
    .sources { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 100%; margin-top: 10px; }
    .sources-label { color: #8a96a9; font-size: 11px; width: 100%; }
    .source-button { max-width: 100%; border: 1px solid #dbe3fb; border-radius: 7px; background: #fff; color: #5264b8; font-size: 11px; padding: 5px 8px; text-align: left; overflow-wrap: anywhere; }
    .source-button:hover { background: #edf1ff; }
    .reply-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .source-dialog.ticket-dialog { width: min(520px, calc(100vw - 32px)); }
    .ticket-form { padding: 20px 24px; display: grid; gap: 12px; }
    .ticket-form label { display: grid; gap: 7px; font-size: 13px; }
    .ticket-form textarea, .ticket-form select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; color: var(--ink); background: var(--bg); }
    .ticket-form textarea { min-height: 110px; max-height: 200px; }
    .ticket-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .ticket-status { margin: 0; font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; white-space: pre-wrap; }
    .source-dialog { width: min(850px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; border: 1px solid #dce4f5; border-radius: 18px; box-shadow: var(--shadow); color: var(--ink); }
    .source-dialog::backdrop { background: rgba(27,39,65,.38); }
    .source-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 24px 14px; border-bottom: 1px solid var(--line); }
    .source-header h2 { margin: 0; font-size: 17px; }
    .source-header .top-action { flex: none; white-space: nowrap; }
    .source-path { color: var(--muted); font-size: 12px; margin: 8px 0 0; overflow-wrap: anywhere; }
    .source-content { overflow-y: auto; max-height: calc(100dvh - 160px); padding: 18px 24px 24px; }
    .source-content h3 { font-size: 13px; margin: 0 0 10px; }
    .source-original { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.8 "Microsoft YaHei", system-ui, sans-serif; background: #f5f7fb; padding: 15px; border: 1px solid var(--line); border-radius: 10px; margin: 0 0 18px; }
    .source-line { display: block; min-height: 1.8em; }
    .source-line.highlight { background: #fff0bf; border-left: 3px solid #c79a22; padding-left: 6px; }
    .source-status { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fff; }
    .topbar {
      height: 84px; flex: none; display: flex; align-items: center; justify-content: space-between;
      padding: 0 36px; border-bottom: 1px solid var(--line);
    }
    .agent-heading { display: flex; align-items: center; gap: 12px; }
    .agent-avatar { width: 40px; height: 40px; border-radius: 13px; font-size: 21px; }
    .agent-heading h1 { margin: 0 0 4px; font-size: 16px; font-weight: 750; }
    .presence { display: flex; align-items: center; gap: 6px; color: #8a96a9; font-size: 12px; }
    .presence::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #42be8d; box-shadow: 0 0 0 3px #e1f7ed; }
    .top-action {
      border: 1px solid var(--line); background: #fff; color: #69768d;
      border-radius: 10px; padding: 9px 13px; font-size: 12px; font-weight: 650;
    }
    .top-action:hover { color: var(--blue); border-color: #ced6f8; }
    .top-action:disabled { opacity: .5; cursor: default; }
    .thread {
      flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      padding: 34px max(28px, calc((100% - 760px) / 2)) 22px;
      scrollbar-width: thin; scrollbar-color: #c9d3ea transparent;
    }
    .thread::-webkit-scrollbar { width: 8px; }
    .thread::-webkit-scrollbar-thumb { background: #c9d3ea; border-radius: 20px; border: 2px solid #fff; }
    .jump-latest {
      position: absolute; right: 36px; bottom: 112px; z-index: 2;
      padding: 9px 13px; border: 1px solid #dce4f5; border-radius: 100px;
      background: #fff; color: #5264b8; font-size: 12px; font-weight: 650;
      box-shadow: 0 5px 18px rgba(47, 65, 113, .13);
    }
    .jump-latest[hidden] { display: none; }
    .jump-latest:hover { background: #f5f7ff; }
    .welcome {
      min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding-bottom: 35px;
    }
    .welcome[hidden] { display: none; }
    .welcome-icon { width: 62px; height: 62px; border-radius: 20px; font-size: 31px; margin-bottom: 22px; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: .18em; }
    .welcome h2 { margin: 9px 0 10px; font-size: clamp(25px, 3.1vw, 36px); letter-spacing: -.04em; }
    .welcome p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .suggestions {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
      margin-top: 31px; max-width: 650px;
    }
    .suggestion {
      border: 1px solid #e1e7f6; background: #fbfcff;
      color: #53627c; border-radius: 100px; padding: 10px 14px;
      font-size: 12px; transition: background .18s, border-color .18s, transform .18s;
    }
    .suggestion:hover { background: #f1f4ff; border-color: #bfcbfb; transform: translateY(-2px); }
    .messages { display: flex; flex-direction: column; gap: 25px; }
    .message { display: flex; align-items: flex-start; gap: 10px; max-width: 88%; animation: rise .22s ease-out; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }
    .bubble-avatar {
      width: 28px; height: 28px; border-radius: 9px; flex: none;
      display: grid; place-items: center; font-size: 13px; font-weight: 700;
      background: #edf0ff; color: var(--blue);
    }
    .user .bubble-avatar { background: #edf0f4; color: #65748c; }
    .bubble-wrap { min-width: 0; }
    .bubble {
      width: fit-content; max-width: 100%;
      padding: 13px 16px; border-radius: 5px 17px 17px;
      background: #f3f5fa; color: #33415b;
      line-height: 1.75; font-size: 14px; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user .bubble { margin-left: auto; border-radius: 17px 5px 17px 17px; color: #fff; background: linear-gradient(135deg, #6477e5, #4d62d1); }
    .bubble-meta { margin-top: 6px; color: #a5afbf; font-size: 10px; }
    .tool-trace { display: inline-flex; align-items: center; gap: 5px; margin: 8px 0 0; padding: 4px 8px; border: 1px solid #dbe3fb; border-radius: 7px; background: #f4f6ff; color: #4b60b6; font-size: 11px; font-weight: 650; }
    .tool-trace[hidden] { display: none; }
    .tool-trace[data-state="error"] { border-color: #f0ddd6; background: #fff7f3; color: #a7624b; }
    .user .bubble-meta { text-align: right; }
    .typing { display: inline-flex; gap: 4px; vertical-align: middle; padding: 4px 1px; }
    .typing span { width: 5px; height: 5px; border-radius: 50%; background: #8e9ac1; animation: pulse 1s infinite alternate; }
    .typing span:nth-child(2) { animation-delay: .17s; }
    .typing span:nth-child(3) { animation-delay: .34s; }
    .notice {
      align-self: center; max-width: 90%; padding: 9px 13px; border-radius: 10px;
      background: #fff3f1; color: #a6544a; font-size: 12px; text-align: center;
    }
    .composer-area { flex: none; padding: 17px max(28px, calc((100% - 760px) / 2)) 19px; border-top: 1px solid #f0f2f7; }
    .composer {
      display: flex; align-items: flex-end; gap: 12px;
      border: 1px solid #dfe5f0; border-radius: 17px;
      background: #fff; padding: 10px 10px 10px 17px;
      box-shadow: 0 5px 18px rgba(53, 73, 120, .05);
      transition: border-color .18s, box-shadow .18s;
    }
    .composer:focus-within { border-color: #9daaf0; box-shadow: 0 5px 22px rgba(82,104,217,.13); }
    textarea {
      resize: none; border: 0; outline: 0; background: transparent;
      flex: 1; min-width: 0; max-height: 132px; min-height: 27px;
      padding: 5px 0; line-height: 1.6; color: var(--ink); font-size: 14px;
    }
    textarea::placeholder { color: #a4afc0; }
    .send {
      width: 38px; height: 38px; flex: none; display: grid; place-items: center;
      border: 0; border-radius: 11px; background: var(--blue);
      color: white; transition: background .18s, transform .18s;
    }
    .send:hover:not(:disabled) { background: var(--blue-deep); transform: translateY(-1px); }
    .send:disabled { background: #b9c1e6; cursor: default; }
    .composer-foot {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 9px 3px 0; color: #a0aabd; font-size: 11px;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { from { opacity: .35; transform: translateY(1px); } to { opacity: 1; transform: translateY(-2px); } }
    @media (max-width: 820px) {
      .shell { width: 100%; height: 100dvh; min-height: 0; margin: 0; border: 0; border-radius: 0; grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .sidebar[data-open="true"] { display: flex; position: fixed; inset: 0 auto 0 0; width: min(300px, 85vw); z-index: 6; box-shadow: var(--shadow); }
      .history-toggle { display: inline-block; }
      .history-backdrop[data-open="true"] { display: block; position: fixed; inset: 0; z-index: 5; border: 0; background: rgba(27,39,65,.38); }
      .topbar { height: 72px; padding: 0 20px; }
      .thread { padding: 25px 18px 16px; }
      .composer-area { padding: 12px 17px 14px; }
      .message { max-width: 94%; }
      .welcome { padding: 0 7px 35px; }
      .jump-latest { right: 18px; bottom: 108px; }
    }
    @media (max-height: 680px) {
      .sidebar { gap: 18px; padding-top: 18px; padding-bottom: 18px; }
      .side-card { display: none; }
      .history-section { margin-top: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="对话导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div><div class="brand-name">SayHelp</div><div class="brand-sub">Customer care</div></div>
      </div>
      <div>
        <div class="side-title">会话</div>
        <button class="new-chat" id="newChatSide" type="button"><span class="plus" aria-hidden="true">＋</span> 开始新对话</button>
      </div>
      <nav class="history-section" aria-label="历史对话">
        <div class="side-title">历史对话</div>
        <p class="history-notice" id="historyNotice" role="status" aria-live="polite" hidden></p>
        <div class="history-list" id="historyList"><span class="history-empty">正在加载历史…</span></div>
        <button class="history-more" id="historyMore" type="button" hidden>加载更多</button>
      </nav>
      <div class="side-card">
        <div class="spark" aria-hidden="true">✦</div>
        <strong>有问题，随时问我</strong>
        <p>商品咨询、订单疑问、售后问题，都可以在这里开始对话。</p>
      </div>
      <div class="side-foot">历史对话已保存<br>刷新页面可继续当前对话</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="agent-heading">
          <div class="agent-avatar" aria-hidden="true">✦</div>
          <div><h1>SayHelp 在线客服</h1><div class="presence" id="presence">随时为你服务</div></div>
        </div>
        <div class="top-actions"><button class="top-action history-toggle" id="historyToggle" type="button" aria-expanded="false">历史</button><button class="top-action" id="newChatTop" type="button">新对话</button></div>
      </header>
      <section class="thread" id="thread" aria-label="聊天记录">
        <div class="welcome" id="welcome">
          <div class="welcome-icon" aria-hidden="true">✦</div>
          <div class="eyebrow">HOW CAN WE HELP?</div>
          <h2>你好，今天想了解什么？</h2>
          <p>把问题告诉我，我们一起找到合适的解决办法。</p>
          <div class="suggestions">
            <button class="suggestion" type="button" data-prompt="我的订单什么时候发货？">我的订单什么时候发货？</button>
            <button class="suggestion" type="button" data-prompt="收到的商品有问题，怎么申请售后？">怎么申请售后？</button>
            <button class="suggestion" type="button" data-prompt="可以介绍一下退换货流程吗？">了解退换货流程</button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite" aria-relevant="additions text"></div>
      </section>
      <button class="jump-latest" id="jumpLatest" type="button" hidden>↓ 跳到最新消息</button>
      <div class="composer-area">
        <form class="composer" id="composer">
          <textarea id="messageInput" rows="1" maxlength="4000" aria-label="输入消息" placeholder="输入你的问题…" autocomplete="off"></textarea>
          <button class="send" id="sendButton" type="submit" aria-label="发送消息" disabled>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 12 15-7-5 15-2.5-6.5L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m11.5 13.5 7.5-8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </form>
        <div class="composer-foot"><span>Enter 发送 · Shift + Enter 换行</span><span id="footerStatus">在线</span></div>
      </div>
    </main>
  </div>
  <button class="history-backdrop" id="historyBackdrop" type="button" aria-label="关闭历史对话"></button>
  <dialog class="source-dialog ticket-dialog" id="ticketDialog" aria-labelledby="ticketTitle">
    <div class="source-header"><h2 id="ticketTitle">确认建工单</h2></div>
    <form class="ticket-form" id="ticketForm">
      <label for="ticketDescription">问题描述<textarea id="ticketDescription" required></textarea></label>
      <label for="ticketType">工单类型<select id="ticketType"><option>售后</option><option>投诉</option><option>咨询</option></select></label>
      <p class="ticket-status" id="ticketStatus" role="status" aria-live="polite"></p>
      <div class="ticket-buttons"><button class="top-action" id="ticketCancel" type="button">取消</button><button class="top-action" id="ticketSubmit" type="submit">确认建单</button></div>
    </form>
  </dialog>
  <dialog class="source-dialog" id="sourceDialog" aria-labelledby="sourceTitle">
    <div class="source-header"><div><h2 id="sourceTitle">来源原文</h2><p class="source-path" id="sourcePath"></p></div><button class="top-action" id="sourceClose" type="button" autofocus>关闭</button></div>
    <div class="source-content"><h3>本次回答使用的知识片段</h3><pre class="source-original" id="sourceExcerpt"></pre><p class="source-status" id="sourceStatus"></p><section id="fullDocument" hidden><h3>完整文档原文</h3><pre class="source-original" id="sourceDocument"></pre></section></div>
  </dialog>
  <script>
    (() => {
      const thread = document.getElementById("thread");
      const messages = document.getElementById("messages");
      const welcome = document.getElementById("welcome");
      const input = document.getElementById("messageInput");
      const composer = document.getElementById("composer");
      const sendButton = document.getElementById("sendButton");
      const newChatButtons = [document.getElementById("newChatSide"), document.getElementById("newChatTop")];
      const presence = document.getElementById("presence");
      const footerStatus = document.getElementById("footerStatus");
      const historyList = document.getElementById("historyList");
      const historyMore = document.getElementById("historyMore");
      const sidebar = document.querySelector(".sidebar");
      const historyToggle = document.getElementById("historyToggle");
      const historyBackdrop = document.getElementById("historyBackdrop");
      const sourceDialog = document.getElementById("sourceDialog");
      let historyCursor = null;
      let historyLoading = false;
      let historyRequest = 0;
      let historyAbort = null;
      const historySection = document.querySelector(".history-section");
      const historyNotice = document.getElementById("historyNotice");
      const historyMutating = new Set();
      const historyMenu = document.createElement("div");
      historyMenu.className = "history-menu";
      historyMenu.id = "historyMenu";
      historyMenu.setAttribute("role", "menu");
      historyMenu.hidden = true;
      document.body.append(historyMenu);
      let menuItem = null;
      let menuTrigger = null;
      let menuTimer = null;
      let sourceRequest = 0;
      let conversationId = null;
      let busy = false;
      let followLatest = true;
      let conversationEpoch = 0;
      let chatAbort = null;
      const deletedConversations = new Set();
      const actionStates = new Map();
      const ticketDialog = document.getElementById("ticketDialog");
      const ticketDescription = document.getElementById("ticketDescription");
      const ticketType = document.getElementById("ticketType");
      const ticketStatus = document.getElementById("ticketStatus");
      const ticketSubmit = document.getElementById("ticketSubmit");
      const ticketCancel = document.getElementById("ticketCancel");
      let ticketContext = null;

      function invalidateConversationView() {
        conversationEpoch++;
        chatAbort?.abort();
        chatAbort = null;
        ticketContext = null;
        if (ticketDialog.open) ticketDialog.close();
      }
      function currentAction(context) {
        return context && context.epoch === conversationEpoch && context.conversationId === conversationId &&
          context.view.wrap.isConnected && !deletedConversations.has(context.conversationId) &&
          !historyMutating.has(context.conversationId);
      }
      function updateTicketDialog(context) {
        if (ticketContext !== context || !ticketDialog.open || !currentAction(context)) return;
        const state = context.state;
        ticketDescription.value = state.payload?.description ?? context.action.description ?? "";
        ticketType.value = state.payload?.ticket_type ?? context.action.ticket_type ?? "咨询";
        ticketDescription.readOnly = Boolean(state.payload);
        ticketType.disabled = Boolean(state.payload);
        ticketSubmit.disabled = state.pending || Boolean(state.result) || state.stale;
        ticketSubmit.textContent = state.payload && !state.result ? "重试原提交" : "确认建单";
        ticketCancel.textContent = state.result ? "关闭" : "取消";
        ticketStatus.textContent = state.pending ? "正在提交，请稍候…" : state.result ?
          "工单 " + state.result.ticket_no + " · " + state.result.status + " · " + state.result.message : state.error || "确认后将创建工单。";
      }
      function renderActions(view, actions, ownerId) {
        if (!view.messageId || !Array.isArray(actions) || !ownerId) return;
        const controls = document.createElement("div");
        controls.className = "reply-actions";
        const epoch = conversationEpoch;
        const seen = new Set();
        for (const action of actions) {
          if (!action || typeof action.id !== "string" || !action.id || seen.has(action.id) || !["handoff", "create_ticket"].includes(action.kind)) continue;
          seen.add(action.id);
          const key = JSON.stringify([ownerId, action.id]);
          if (!actionStates.has(key)) actionStates.set(key, {pending: false, payload: null, result: null, stale: false, error: "", handedOff: false});
          const state = actionStates.get(key);
          const context = {view, action, state, conversationId: ownerId, epoch};
          const button = document.createElement("button");
          button.type = "button";
          button.className = "top-action";
          button.dataset.kind = action.kind;
          button.textContent = action.kind === "handoff" ? "转人工" : "建工单";
          button.disabled = action.kind === "handoff" && state.handedOff;
          button.addEventListener("click", () => {
            if (!currentAction(context)) return;
            if (action.kind === "handoff") {
              if (state.handedOff) return;
              state.handedOff = true;
              button.disabled = true;
              addNotice("已转接人工客服");
              addMessage("assistant", "您好,我是SayHelp,请问有什么可以帮您的");
            } else {
              ticketContext = context;
              ticketDialog.showModal();
              updateTicketDialog(context);
            }
          });
          controls.append(button);
        }
        if (controls.children.length) view.wrap.append(controls);
        scrollToBottom();
      }
      ticketCancel.addEventListener("click", () => { ticketContext = null; ticketDialog.close(); });
      ticketDialog.addEventListener("cancel", () => { ticketContext = null; });
      document.getElementById("ticketForm").addEventListener("submit", async event => {
        event.preventDefault();
        const context = ticketContext;
        if (!currentAction(context)) { ticketDialog.close(); ticketContext = null; return; }
        const state = context.state;
        if (state.pending || state.result || state.stale) return;
        const description = ticketDescription.value.trim();
        if (!state.payload && !description) { ticketStatus.textContent = "请填写问题描述。"; return; }
        // Retain the attempted payload even after transport failure: only explicit identical retries are safe.
        state.payload ||= {action_id: context.action.id, description, ticket_type: ticketType.value};
        state.pending = true;
        state.error = "";
        updateTicketDialog(context);
        try {
          const response = await fetch("/v1/conversations/" + encodeURIComponent(context.conversationId) + "/tickets", {
            method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(state.payload)
          });
          if (response.status === 404) { state.stale = true; throw new Error("这项建议已失效或对话已删除，请重新打开有效对话。"); }
          if (response.status === 409) throw new Error("对话正在处理中或提交内容冲突，请稍后重试原提交。");
          if (response.status === 422) { state.payload = null; throw new Error("请检查问题描述与工单类型后确认。"); }
          if (!response.ok) throw new Error("建单结果未知，请重试原提交；请勿修改提交内容。");
          const result = await response.json();
          if (typeof result.ticket_no !== "string" || typeof result.status !== "string" || typeof result.message !== "string") throw new Error("建单结果未知，请重试原提交；请勿修改提交内容。");
          state.result = result;
        } catch (error) {
          state.error = error instanceof TypeError || error instanceof SyntaxError ? "建单结果未知，请重试原提交；请勿修改提交内容。" : error.message;
        } finally {
          state.pending = false;
          if (ticketContext?.state === state) updateTicketDialog(ticketContext);
        }
      });

      function rememberConversation(id) {
        try { localStorage.setItem("sayhelp.activeConversation", id || "new"); } catch (_) {}
      }

      function toggleHistory(open) {
        sidebar.dataset.open = String(open);
        historyBackdrop.dataset.open = String(open);
        historyToggle.setAttribute("aria-expanded", String(open));
      }
      historyToggle.addEventListener("click", () => toggleHistory(sidebar.dataset.open !== "true"));
      historyBackdrop.addEventListener("click", () => toggleHistory(false));
      document.addEventListener("keydown", event => { if (event.key === "Escape") toggleHistory(false); });
      document.getElementById("sourceClose").addEventListener("click", () => sourceDialog.close());
      sourceDialog.addEventListener("close", () => { sourceRequest++; });

      function historyStatus(message) {
        historyNotice.textContent = message;
        historyNotice.hidden = !message;
      }
      function closeHistoryMenu(restoreFocus = false) {
        clearTimeout(menuTimer);
        const trigger = menuTrigger;
        if (trigger) trigger.setAttribute("aria-expanded", "false");
        historyMenu.hidden = true;
        menuTrigger = menuItem = null;
        if (restoreFocus && trigger?.isConnected) trigger.focus();
      }
      function postponeMenuClose() {
        clearTimeout(menuTimer);
        menuTimer = setTimeout(() => closeHistoryMenu(), 220);
      }
      function showHistoryMenu(item, trigger, focus = false) {
        if (trigger.disabled) return;
        closeHistoryMenu();
        menuItem = item;
        menuTrigger = trigger;
        trigger.setAttribute("aria-expanded", "true");
        historyMenu.replaceChildren();
        for (const [action, label] of [["pin", item.is_pinned ? "取消置顶" : "置顶"], ["delete", "删除"]]) {
          const button = document.createElement("button");
          button.type = "button";
          button.setAttribute("role", "menuitem");
          button.textContent = label;
          if (action === "delete") button.className = "history-delete";
          button.addEventListener("click", () => manageHistory(item, action));
          historyMenu.append(button);
        }
        historyMenu.hidden = false;
        positionHistoryMenu();
        if (focus) historyMenu.firstElementChild.focus();
      }
      function positionHistoryMenu() {
        if (historyMenu.hidden || !menuTrigger) return;
        const rect = menuTrigger.getBoundingClientRect();
        const bounds = historySection.getBoundingClientRect();
        if (rect.bottom <= bounds.top || rect.top >= bounds.bottom) { closeHistoryMenu(); return; }
        const top = rect.bottom + 4 + historyMenu.offsetHeight <= innerHeight - 8 ? rect.bottom + 4 : rect.top - historyMenu.offsetHeight - 4;
        historyMenu.style.left = Math.max(8, Math.min(rect.right - 142, innerWidth - 150)) + "px";
        historyMenu.style.top = Math.max(8, top) + "px";
      }
      historyMenu.addEventListener("mouseenter", () => clearTimeout(menuTimer));
      historyMenu.addEventListener("mouseleave", postponeMenuClose);
      historyMenu.addEventListener("focusout", event => {
        if (!historyMenu.contains(event.relatedTarget) && event.relatedTarget !== menuTrigger) closeHistoryMenu();
      });
      historyMenu.addEventListener("keydown", event => {
        const buttons = [...historyMenu.querySelectorAll("button")];
        if (["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)) {
          event.preventDefault();
          const current = buttons.indexOf(document.activeElement);
          const next = event.key === "Home" ? 0 : event.key === "End" ? buttons.length - 1 : (current + (event.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length;
          buttons[next].focus();
        }
      });
      document.addEventListener("keydown", event => { if (event.key === "Escape") closeHistoryMenu(true); });
      document.addEventListener("pointerdown", event => {
        if (!historyMenu.contains(event.target) && !menuTrigger?.contains(event.target)) closeHistoryMenu();
      });
      historySection.addEventListener("scroll", positionHistoryMenu, {passive: true});
      window.addEventListener("resize", () => closeHistoryMenu());

      function markActiveHistory() {
        historyList.querySelectorAll("[data-conversation]").forEach(button => {
          button.setAttribute("aria-current", String(button.dataset.conversation === conversationId));
          button.disabled = historyMutating.has(button.dataset.conversation);
        });
        historyList.querySelectorAll("[data-manage]").forEach(button => {
          button.disabled = historyMutating.has(button.dataset.manage) || (busy && button.dataset.manage === conversationId);
        });
      }
      function historyRow(item) {
        const row = document.createElement("div");
        row.className = "history-row";
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item";
        button.dataset.conversation = item.id;
        const title = document.createElement("span");
        title.className = "history-title";
        if (item.is_pinned) {
          const badge = document.createElement("span");
          badge.className = "history-pin";
          badge.textContent = "📌 置顶";
          title.append(badge);
        }
        title.append(document.createTextNode(item.title));
        button.title = item.title;
        const date = document.createElement("span");
        date.className = "history-date";
        date.textContent = item.updated_at.replace("T", " ").slice(0, 16);
        button.append(title, date);
        button.addEventListener("click", () => { if (!historyMutating.has(item.id)) openConversation(item.id); });
        const more = document.createElement("button");
        more.type = "button";
        more.className = "history-dots";
        more.textContent = "...";
        more.dataset.manage = item.id;
        more.setAttribute("aria-label", "管理对话：" + item.title);
        more.setAttribute("aria-haspopup", "menu");
        more.setAttribute("aria-controls", "historyMenu");
        more.setAttribute("aria-expanded", "false");
        more.addEventListener("mouseenter", () => showHistoryMenu(item, more));
        more.addEventListener("mouseleave", postponeMenuClose);
        more.addEventListener("click", event => showHistoryMenu(item, more, event.detail === 0));
        more.addEventListener("keydown", event => {
          if (event.key === "ArrowDown") { event.preventDefault(); showHistoryMenu(item, more, true); }
        });
        row.append(button, more);
        return row;
      }
      async function manageHistory(item, action) {
        closeHistoryMenu();
        if (historyMutating.has(item.id) || (busy && item.id === conversationId)) return;
        if (action === "delete" && !window.confirm("删除对话「" + item.title + "」？删除后将从历史列表移除，无法继续此对话；相关消息、工单和审计记录仍保留。")) return;
        historyMutating.add(item.id);
        markActiveHistory();
        historyStatus("正在更新…");
        try {
          const path = "/v1/conversations/" + encodeURIComponent(item.id);
          const response = await fetch(path + (action === "pin" ? "/pin" : ""), action === "pin" ? {
            method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify({is_pinned: !item.is_pinned})
          } : {method: "DELETE"});
          if (!response.ok) throw new Error(response.status === 409 ? "该对话正在回复中，请回复结束后再操作。" : response.status === 404 ? "这段历史对话已不存在，请刷新列表。" : "操作失败，记录未更新，请稍后重试。");
          if (action === "delete") {
            deletedConversations.add(item.id);
            if (conversationId === item.id) resetConversation(false);
          }
          historyStatus(action === "delete" ? "已删除对话" : item.is_pinned ? "已取消置顶" : "已置顶");
          await loadHistory();
        } catch (error) { historyStatus(error.message); }
        finally { historyMutating.delete(item.id); markActiveHistory(); }
      }
      async function loadHistory(append = false) {
        if (append && (historyLoading || !historyCursor)) return [];
        historyAbort?.abort();
        historyAbort = new AbortController();
        const requestId = ++historyRequest;
        historyLoading = true;
        historyMore.disabled = true;
        try {
          const query = append && historyCursor ? "?before=" + encodeURIComponent(historyCursor) : "";
          const response = await fetch("/v1/conversations" + query, {signal: historyAbort.signal});
          if (!response.ok) throw new Error("历史暂时无法加载，请稍后重试。");
          const data = await response.json();
          if (requestId !== historyRequest) return [];
          closeHistoryMenu();
          if (!append) { historyList.replaceChildren(); historySection.scrollTop = 0; }
          const existing = new Set([...historyList.querySelectorAll("[data-conversation]")].map(button => button.dataset.conversation));
          for (const item of data.conversations) {
            if (!existing.has(item.id)) { historyList.append(historyRow(item)); existing.add(item.id); }
          }
          if (!historyList.children.length) {
            const empty = document.createElement("span");
            empty.className = "history-empty";
            empty.textContent = "暂无历史对话";
            historyList.append(empty);
          }
          historyCursor = data.next_cursor;
          historyMore.hidden = !historyCursor;
          markActiveHistory();
          return data.conversations;
        } catch (error) {
          if (error.name !== "AbortError" && requestId === historyRequest) historyStatus(error.message);
          return [];
        } finally {
          if (requestId === historyRequest) { historyLoading = false; historyMore.disabled = false; }
        }
      }
      historyMore.addEventListener("click", () => loadHistory(true));

      async function openConversation(id) {
        invalidateConversationView();
        const epoch = conversationEpoch;
        setBusy(true);
        toggleHistory(false);
        try {
          const response = await fetch("/v1/conversations/" + encodeURIComponent(id) + "/messages");
          if (!response.ok) throw new Error(response.status === 404 ? "这段历史对话已不存在。" : "历史对话加载失败，请稍后重试。");
          const data = await response.json();
          if (epoch !== conversationEpoch || deletedConversations.has(id) || deletedConversations.has(data.conversation_id)) return;
          conversationId = data.conversation_id;
          rememberConversation(conversationId);
          messages.replaceChildren();
          welcome.hidden = data.messages.length > 0;
          followLatest = true;
          for (const item of data.messages) {
            const view = addMessage(item.role, item.content);
            if (item.role === "assistant") {
              view.messageId = item.id;
              decorateAnswer(view, item.content, item.citations?.length ? item.citations : (item.sources || []));
              renderActions(view, item.actions, conversationId);
            }
          }
          scrollToBottom(true);
          markActiveHistory();
        } catch (error) {
          if (epoch === conversationEpoch) addNotice(error.message);
        } finally {
          if (epoch === conversationEpoch) setBusy(false);
        }
      }

      function sourceDocumentUrl(source) {
        const names = new Set(["after-sales-manual.md", "product-faq.md", "product-specs.md", "returns-policy.md"]);
        const file = typeof source.source_file === "string" ? source.source_file.replace(/^knowledge_db\//, "") : "";
        if (!names.has(file)) return null;
        const expected = "/v1/knowledge/documents/" + encodeURIComponent(file);
        if (source.source_url) {
          try {
            const url = new URL(source.source_url, location.origin);
            if (url.origin !== location.origin || url.pathname !== expected || url.search || url.hash || url.username || url.password) return null;
          } catch { return null; }
        }
        return expected;
      }

      async function showSource(source) {
        const request = ++sourceRequest;
        document.getElementById("sourceTitle").textContent = "来源 [" + source.n + "] · " + (source.question || "知识片段");
        document.getElementById("sourcePath").textContent = source.section_path || source.category || "知识库问答";
        document.getElementById("sourceExcerpt").textContent = source.answer || "此记录未保存来源原文。";
        const status = document.getElementById("sourceStatus");
        const full = document.getElementById("fullDocument");
        const original = document.getElementById("sourceDocument");
        full.hidden = true;
        original.replaceChildren();
        const documentUrl = sourceDocumentUrl(source);
        status.textContent = documentUrl ? "正在读取完整文档…" : "这是该次检索保存的知识片段；旧记录未关联到可确认的文档文件。";
        if (!sourceDialog.open) sourceDialog.showModal();
        if (!documentUrl) return;
        try {
          const response = await fetch(documentUrl);
          if (!response.ok) throw new Error("完整文档暂时无法读取，上方知识片段仍可查看。");
          const documentData = await response.json();
          if (request !== sourceRequest) return;
          const digest = source.source_digest || source.document_sha256;
          const unchanged = typeof digest === "string" && digest.length > 0 && documentData.sha256 === digest;
          const startLine = source.source_start_line ?? source.source_line;
          const endLine = source.source_end_line ?? startLine;
          const linesCount = documentData.text.split("\n").length;
          const hasRange = Number.isInteger(startLine) && Number.isInteger(endLine) && startLine > 0 && endLine >= startLine && endLine <= linesCount;
          status.textContent = !unchanged ? source.source_file + " · 原文版本不同或无法核验，下方为最新文档，上方保留当时知识片段。" : hasRange ? source.source_file + " · 第 " + startLine + "–" + endLine + " 行（黄色定位）" : source.source_file + " · 已核验文档，旧记录缺少有效定位行号。";
          const lines = documentData.text.split("\n");
          let highlighted = null;
          lines.forEach((text, index) => {
            const line = document.createElement("span");
            line.className = "source-line";
            line.textContent = text;
            if (unchanged && hasRange && index + 1 >= startLine && index + 1 <= endLine) { line.classList.add("highlight"); highlighted ||= line; }
            original.append(line);
          });
          full.hidden = false;
          if (highlighted) highlighted.scrollIntoView({ block: "center" });
        } catch (error) {
          if (request === sourceRequest) status.textContent = error.message;
        }
      }

      function decorateAnswer(view, text, sources) {
        if (!Array.isArray(sources) || !sources.length) return;
        sources = sources.filter(source => source && Number.isInteger(source.n) && source.n > 0 && typeof source.answer === "string");
        if (!sources.length) return;
        view.bubble.replaceChildren();
        const byNumber = new Map(sources.map(source => [String(source.n), source]));
        const pattern = /\[(\d{1,3})\]/g;
        let start = 0;
        for (const match of text.matchAll(pattern)) {
          view.bubble.append(document.createTextNode(text.slice(start, match.index)));
          const source = byNumber.get(match[1]);
          if (source) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "citation";
            button.textContent = match[0];
            button.setAttribute("aria-label", "查看来源 " + source.n);
            button.addEventListener("click", () => showSource(source));
            view.bubble.append(button);
          } else view.bubble.append(document.createTextNode(match[0]));
          start = match.index + match[0].length;
        }
        view.bubble.append(document.createTextNode(text.slice(start)));
        const controls = document.createElement("div");
        controls.className = "sources";
        const label = document.createElement("span");
        label.className = "sources-label";
        label.textContent = "来源原文";
        controls.append(label);
        for (const source of sources) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "source-button";
          button.textContent = "[" + source.n + "] " + (source.section_path || source.question);
          button.addEventListener("click", () => showSource(source));
          controls.append(button);
        }
        view.wrap.append(controls);
      }

      function atBottom() {
        return thread.scrollHeight - thread.clientHeight - thread.scrollTop <= 4;
      }

      function updateJumpButton() {
        jumpLatest.hidden = followLatest || thread.scrollHeight <= thread.clientHeight;
      }

      function scrollToBottom(force = false) {
        if (force) followLatest = true;
        if (followLatest) thread.scrollTop = thread.scrollHeight;
        updateJumpButton();
      }

      thread.addEventListener("wheel", event => {
        if (event.deltaY < 0 && thread.scrollHeight > thread.clientHeight) {
          followLatest = false;
          updateJumpButton();
        }
      }, { passive: true });
      thread.addEventListener("touchmove", () => {
        if (thread.scrollHeight > thread.clientHeight) {
          followLatest = false;
          updateJumpButton();
        }
      }, { passive: true });
      thread.addEventListener("scroll", () => {
        if (!followLatest && atBottom()) followLatest = true;
        updateJumpButton();
      });
      jumpLatest.addEventListener("click", () => scrollToBottom(true));

      function setBusy(value) {
        busy = value;
        sendButton.disabled = value || !input.value.trim();
        newChatButtons.forEach(button => button.disabled = false);
        presence.textContent = value ? "正在回复…" : "随时为你服务";
        footerStatus.textContent = value ? "客服输入中" : "在线";
        markActiveHistory();
      }

      function addMessage(role, text) {
        const row = document.createElement("div");
        row.className = "message " + role;
        const avatar = document.createElement("div");
        avatar.className = "bubble-avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = role === "user" ? "我" : "✦";
        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        const meta = document.createElement("div");
        meta.className = "bubble-meta";
        meta.textContent = role === "user" ? "你" : "SayHelp";
        wrap.append(bubble, meta);
        let trace = null;
        if (role === "assistant") {
          trace = document.createElement("div");
          trace.className = "tool-trace";
          trace.hidden = true;
          trace.setAttribute("aria-live", "polite");
          wrap.insertBefore(trace, meta);
        }
        row.append(avatar, wrap);
        messages.append(row);
        scrollToBottom();
        return { bubble, trace, wrap };
      }

      function addNotice(text) {
        const notice = document.createElement("div");
        notice.className = "notice";
        notice.textContent = text;
        messages.append(notice);
        scrollToBottom();
      }

      function makeRenderer(bubble, isCurrent) {
        let pending = "";
        let frame = 0;
        function flush() {
          if (frame) cancelAnimationFrame(frame);
          frame = 0;
          if (!isCurrent()) { pending = ""; return; }
          if (pending) {
            bubble.textContent += pending;
            pending = "";
            scrollToBottom();
          }
        }
        return {
          append(text) {
            pending += text;
            if (!frame) frame = requestAnimationFrame(flush);
          },
          async drain() { flush(); }
        };
      }

      function readEvent(frame) {
        let name = "message";
        const data = [];
        for (const line of frame.split("\n")) {
          if (!line || line.startsWith(":")) continue;
          const split = line.indexOf(":");
          const key = split < 0 ? line : line.slice(0, split);
          let value = split < 0 ? "" : line.slice(split + 1);
          if (value.startsWith(" ")) value = value.slice(1);
          if (key === "event") name = value;
          if (key === "data") data.push(value);
        }
        if (!data.length) return null;
        return { name, payload: JSON.parse(data.join("\n")) };
      }

      async function sendMessage(rawText) {
        const text = rawText.trim();
        if (!text || busy) return;
        welcome.hidden = true;
        followLatest = true;
        addMessage("user", text);
        input.value = "";
        input.style.height = "auto";
        setBusy(true);

        const epoch = conversationEpoch;
        const controller = new AbortController();
        chatAbort = controller;
        const view = addMessage("assistant", "");
        const isCurrent = () => epoch === conversationEpoch && view.wrap.isConnected;
        const { bubble, trace } = view;
        let answerSources = [];
        let answerActions = null;
        let finalMessageId = null;
        const indicator = document.createElement("span");
        indicator.className = "typing";
        indicator.innerHTML = "<span></span><span></span><span></span>";
        bubble.append(indicator);
        const renderer = makeRenderer(bubble, isCurrent);
        let receivedToken = false;
        let done = false;
        let errorText = "";

        try {
          const response = await fetch("/v1/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
            body: JSON.stringify({ message: text, conversation_id: conversationId }),
            signal: controller.signal
          });
          if (!response.ok) {
            if (response.status === 404) throw new Error("会话已失效，请点“新对话”后重试。");
            if (response.status === 409) throw new Error("上条消息还在处理中，请稍后重试。");
            if (response.status === 413) throw new Error("消息过长，请缩短后重试。");
            if (response.status === 503) throw new Error("当前会话已满，请稍后重试。");
            throw new Error("请求失败（HTTP " + response.status + "），请稍后重试。");
          }
          if (!response.body) throw new Error("当前浏览器无法读取流式回复。");
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          function handleFrame(frame) {
            if (!isCurrent()) return;
            const item = readEvent(frame);
            if (!item) return;
            if (item.name === "session") {
              conversationId = item.payload.conversation_id;
              rememberConversation(conversationId);
            } else if (item.name === "tool_status") {
              const toolName = item.payload.name;
              if (typeof toolName === "string" && /^[a-z_]+$/.test(toolName) && toolName !== "unknown") {
                trace.hidden = false;
                trace.dataset.state = item.payload.state || "running";
                trace.textContent = item.payload.state === "running" ? "◌ 正在调用 " + toolName : "✦ 已调用 " + toolName;
                scrollToBottom();
              }
            } else if (item.name === "retrieval_status") {
              const labels = { understanding: "正在理解问题…", retrieval: "正在检索并核对知识…", generation: "正在校验答案与引用…", complete: "知识核对完成" };
              trace.hidden = false;
              trace.dataset.state = item.payload.state || "running";
              trace.textContent = labels[item.payload.stage] || (item.payload.state === "complete" ? "知识核对完成" : "正在检索知识…");
              scrollToBottom();
            } else if (item.name === "citations" || item.name === "sources") {
              const evidence = item.name === "citations" ? item.payload.citations : item.payload.sources;
              answerSources = Array.isArray(evidence) ? evidence : [];
            } else if (item.name === "actions") {
              answerActions = item.payload;
            } else if (item.name === "token") {
              if (!receivedToken) {
                receivedToken = true;
                indicator.remove();
              }
              renderer.append(item.payload.text || "");
            } else if (item.name === "error") {
              throw new Error("回复中断，请重试。");
            } else if (item.name === "done") {
              done = true;
              finalMessageId = item.payload.message_id;
              if (!trace.hidden) { trace.dataset.state = "complete"; trace.textContent = "回答已完成"; }
            }
          }
          while (true) {
            const { value, done: streamEnded } = await reader.read();
            if (!isCurrent()) { await reader.cancel(); return; }
            if (streamEnded) break;
            buffer += decoder.decode(value, { stream: true });
            buffer = buffer.replace(/\r\n/g, "\n");
            let boundary;
            while ((boundary = buffer.indexOf("\n\n")) !== -1) {
              handleFrame(buffer.slice(0, boundary));
              buffer = buffer.slice(boundary + 2);
            }
          }
          buffer += decoder.decode();
          if (buffer.trim()) handleFrame(buffer.replace(/\r\n/g, "\n").trim());
          if (!done) throw new Error("连接提前中断，请重试。");
          await renderer.drain();
          if (!isCurrent()) return;
          decorateAnswer(view, bubble.textContent, answerSources);
          if (answerActions && answerActions.message_id === finalMessageId) {
            view.messageId = finalMessageId;
            renderActions(view, answerActions.actions, conversationId);
          }
        } catch (error) {
          errorText = error instanceof Error ? error.message : "发送失败，请重试。";
          await renderer.drain();
        } finally {
          if (!isCurrent()) return;
          chatAbort = null;
          indicator.remove();
          if (!receivedToken) {
            bubble.textContent = errorText ? "暂时没能回复。" : "暂时没有收到文字回复。";
          }
          if (errorText) {
            if (!trace.hidden) { trace.dataset.state = "error"; trace.textContent = "处理已中断"; }
            addNotice(errorText);
          }
          setBusy(false);
          loadHistory();
          input.focus();
          scrollToBottom();
        }
      }

      composer.addEventListener("submit", event => {
        event.preventDefault();
        sendMessage(input.value);
      });
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 132) + "px";
        sendButton.disabled = busy || !input.value.trim();
      });
      input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          sendMessage(input.value);
        }
      });
      function resetConversation(focus = true) {
        invalidateConversationView();
        setBusy(false);
        closeHistoryMenu();
        conversationId = null;
        rememberConversation(null);
        toggleHistory(false);
        markActiveHistory();
        followLatest = true;
        messages.replaceChildren();
        updateJumpButton();
        welcome.hidden = false;
        input.value = "";
        input.style.height = "auto";
        sendButton.disabled = true;
        if (focus) input.focus();
      }
      newChatButtons.forEach(button => button.addEventListener("click", () => resetConversation()));
      document.querySelectorAll("[data-prompt]").forEach(button => {
        button.addEventListener("click", () => sendMessage(button.dataset.prompt));
      });
      async function initializeHistory() {
        setBusy(true);
        const conversations = await loadHistory();
        setBusy(false);
        let saved = null;
        try { saved = localStorage.getItem("sayhelp.activeConversation"); } catch (_) {}
        if (saved === "new") return;
        const id = saved && /^[0-9]+$/.test(saved) ? saved : conversations[0]?.id;
        if (id) await openConversation(id);
      }
      initializeHistory();
    })();
  </script>
</body>
</html>
