# Based on https://github.com/milvus-io/milvus/blob/v2.6.24/deployments/docker/standalone/docker-compose.yml
# Changes: explicit 2.6.24 image, named volumes, loopback ports, healthy dependencies.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 30s
      timeout: 20s
      retries: 3
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_USER:?Set MILVUS_MINIO_USER in .env}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_PASSWORD:?Set MILVUS_MINIO_PASSWORD in .env}
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ':9001'
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 30s
      timeout: 20s
      retries: 3
  standalone:
    image: milvusdb/milvus:v2.6.24
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_USER:?Set MILVUS_MINIO_USER in .env}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_PASSWORD:?Set MILVUS_MINIO_PASSWORD in .env}
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - '127.0.0.1:19530:19530'
      - '127.0.0.1:9091:9091'
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
volumes:
  milvus_etcd:
  milvus_minio:
  milvus_data:
